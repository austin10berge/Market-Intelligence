services:

  # ── Redis cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: market-intelligence-redis
    command: redis-server --save "" --appendonly no  # Disable persistence — cache-only use
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: market-intelligence-api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Dashboard (static web UI via nginx) ──────────────────────────────────────
  dashboard:
    build:
      context: .
      target: dashboard
    container_name: market-intelligence-dashboard
    environment:
      # Browser calls the API via the public domain — routed through Caddy
      MARKET_INTELLIGENCE_API_URL: https://market.austin10berge.com/api
    ports:
      - "9009:9009"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Discord bot ──────────────────────────────────────────────────────────────
  discord-bot:
    build:
      context: .
      target: discord-bot
    container_name: market-intelligence-discord-bot
    env_file: .env
    environment:
      # Bot talks to API via container name (internal Docker network)
      MARKET_INTELLIGENCE_API_URL: http://api:8000
      DISCORD_BOT_CALLBACK_PORT: "9000"
    expose:
      - "9000"  # Internal only — allows api container to POST callbacks here
    volumes:
      # Bot resolves the relative db_path from WORKDIR /app/discord_bot, so this
      # maps to the same host ./data dir (and DB file) the api uses. Without it
      # the SQLite DB lives in the container layer and is wiped on recreate.
      - ./data:/app/discord_bot/data
      # Isolated Claude config — NOT the host's real ~/.claude. `claude -p` calls
      # in src/chat.py are hardcoded to --tools WebSearch only (nothing else,
      # e.g. no Edit/Bash), and this settings.json grants nothing on its own,
      # so a Discord message can never alter the bot's own permissions or
      # reach the host's real Claude Code config/credentials.
      - ./.claude/discord-bot-config/.claude:/root/.claude
      - ./.claude/discord-bot-config/.claude.json:/root/.claude.json
      # Read-only so edits are a versioned host-file change, never a bot write
      # (the bot has no Edit/Write tool anyway — see the .claude mount above).
      # Loaded once in discord_bot/commands/chat.py's TradeChat.__init__, so a
      # plain `docker compose restart discord-bot` picks up edits — no rebuild.
      - ./discord_bot/trade_system_prompt.txt:/app/discord_bot/trade_system_prompt.txt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Nightly pipeline (runs once then exits, triggered by cron) ───────────────
  pipeline:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-pipeline
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    profiles:
      - pipeline

  # ── Cache pre-warmer (runs at 9:25 AM ET via cron, profile=prewarm) ──────────
  # Cron entry (LXC host, ET timezone):
  #   25 9 * * 1-5  docker compose -f /root/market-intelligence/docker-compose.yml run --rm prewarm
  prewarm:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-prewarm
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: python3 -m src.prewarm
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    profiles:
      - prewarm

  # ── Test runner (profile=test) ───────────────────────────────────────────────
  # Run: docker compose run --rm test
  # Run specific file: docker compose run --rm test python3 -m pytest tests/test_market_data_store.py -v
  test:
    build:
      context: .
      target: test
    container_name: market-intelligence-test
    volumes:
      - ./data:/app/data
    restart: "no"
    profiles:
      - test

  # ── Market data refresh (daily OHLCV + fundamentals, profile=refresh) ───────
  # Cron entry (LXC host, ET timezone):
  #   30 16 * * 1-5  docker compose -f /root/market-intelligence/docker-compose.yml run --rm market-data-refresh
  # Initial backfill (2 years, run once manually):
  #   docker compose run --rm market-data-refresh python3 -m src.market_data.refresh --full
  market-data-refresh:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-data-refresh
    env_file: .env
    command: python3 -m src.market_data.refresh
    volumes:
      - ./data:/app/data
    restart: "no"
    profiles:
      - refresh

