services:

  # ── Redis cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: market-intelligence-redis
    command: redis-server --save "" --appendonly no  # Disable persistence — cache-only use
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: market-intelligence-api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Dashboard (static web UI via nginx) ──────────────────────────────────────
  dashboard:
    build:
      context: .
      target: dashboard
    container_name: market-intelligence-dashboard
    environment:
      # Browser calls the API via the public domain — routed through Caddy
      MARKET_INTELLIGENCE_API_URL: https://market.austin10berge.com/api
    ports:
      - "9009:9009"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Alpaca MCP server (persistent HTTP; backs the trade chat bot's on-demand
  # options/stock data tool calls). Runs as its own always-on service rather
  # than being spawned per-call over stdio: a fresh `alpaca-mcp-server`
  # process takes ~5s to boot (Python + FastMCP + alpaca-py imports), but
  # `claude -p` dispatches its first request without waiting for MCP servers
  # to finish connecting — a stdio cold-start reliably lost that race and the
  # tool was silently never available. A pre-warm persistent HTTP connection
  # completes in ~100ms, well inside that window. ──────────────────────────
  alpaca-mcp:
    build:
      context: .
      target: base
    container_name: market-intelligence-alpaca-mcp
    env_file: .env
    environment:
      ALPACA_SECRET_KEY: ${ALPACA_API_SECRET}
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TOOLSETS: "options-data,assets,stock-data"
    command: alpaca-mcp-server --transport streamable-http --host 0.0.0.0 --port 8001
    expose:
      - "8001"  # Internal only — discord-bot reaches it via the Docker network
    restart: unless-stopped
    healthcheck:
      # No -f: the MCP endpoint 406s a bare GET (wrong Accept header) even when
      # healthy — this only needs to confirm the server is accepting connections.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8001/mcp"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Schwab MCP bridge (persistent HTTP; backs the trade chat bot's access to
  # real account data — positions, orders, transactions, balances). schwab-mcp
  # only supports stdio transport (no --transport flag, confirmed from its
  # source), so mcp-proxy wraps it and re-exposes it over streamable-HTTP —
  # the same fix alpaca-mcp above needed after its original per-call stdio
  # spawn silently lost the race against claude -p's first request. Verified
  # locally: mcp-proxy --port N -- schwab-mcp server serves a working /mcp
  # endpoint; bare GET returns 406 (healthy) same as alpaca-mcp's endpoint. ──
  schwab-mcp:
    build:
      context: .
      target: base
    container_name: market-intelligence-schwab-mcp
    volumes:
      # Read-write — schwab-mcp needs to persist its own refreshed OAuth
      # access token back to token.yaml (tokens are short-lived, ~30 min,
      # and refresh on nearly every call). discord-bot never gets
      # filesystem access to this credential at all — that's the boundary
      # that actually matters here, not this container's own write access
      # to its own token file. Confirmed necessary via live reproduction
      # (2026-07-15): a :ro mount here made every real tool call fail with
      # "Read-only file system: token.yaml".
      - ~/.local/share/schwab-mcp:/root/.local/share/schwab-mcp
    command: mcp-proxy --port 8002 --host 0.0.0.0 -- schwab-mcp server --no-technical-tools
    ports:
      - "8002:8002"  # LAN-exposed — shared with prod so both envs use one token
    restart: unless-stopped
    healthcheck:
      # No -f: the MCP endpoint 406s a bare GET (wrong Accept header) even when
      # healthy — this only needs to confirm the server is accepting connections.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8002/mcp"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Discord bot ──────────────────────────────────────────────────────────────
  discord-bot:
    build:
      context: .
      target: discord-bot
    container_name: market-intelligence-discord-bot
    env_file: .env
    environment:
      # Bot talks to API via container name (internal Docker network)
      MARKET_INTELLIGENCE_API_URL: http://api:8000
      DISCORD_BOT_CALLBACK_PORT: "9000"
    expose:
      - "9000"  # Internal only — allows api container to POST callbacks here
    volumes:
      # Bot resolves the relative db_path from WORKDIR /app/discord_bot, so this
      # maps to the same host ./data dir (and DB file) the api uses. Without it
      # the SQLite DB lives in the container layer and is wiped on recreate.
      - ./data:/app/discord_bot/data
      # Isolated Claude config — NOT the host's real ~/.claude. `claude -p` calls
      # in src/chat.py are hardcoded to a fixed tool set (WebSearch, ToolSearch,
      # and an explicit allowlist of read-only Alpaca/Schwab MCP tools — nothing
      # else, e.g. no Edit/Bash), and this settings.json grants nothing on its
      # own, so a Discord message can never alter the bot's own permissions or
      # reach the host's real Claude Code config/credentials.
      - ./.claude/discord-bot-config/.claude:/root/.claude
      - ./.claude/discord-bot-config/.claude.json:/root/.claude.json
      # Read-only so edits are a versioned host-file change, never a bot write
      # (the bot has no Edit/Write tool anyway — see the .claude mount above).
      # Loaded once in discord_bot/commands/chat.py's TradeChat.__init__, so a
      # plain `docker compose restart discord-bot` picks up edits — no rebuild.
      - ./discord_bot/trade_system_prompt.txt:/app/discord_bot/trade_system_prompt.txt:ro
    depends_on:
      api:
        condition: service_healthy
      alpaca-mcp:
        condition: service_healthy
      schwab-mcp:
        condition: service_healthy
    restart: unless-stopped

  # ── Nightly pipeline (runs once then exits, triggered by cron) ───────────────
  pipeline:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-pipeline
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    depends_on:
      redis:
        condition: service_healthy
      schwab-mcp:
        condition: service_healthy
    restart: "no"
    profiles:
      - pipeline

  # ── Cache pre-warmer (runs at 9:25 AM ET via cron, profile=prewarm) ──────────
  # Cron entry (LXC host, ET timezone):
  #   25 9 * * 1-5  docker compose -f /root/market-intelligence/docker-compose.yml run --rm prewarm >> /var/log/mi-prewarm.log 2>&1
  prewarm:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-prewarm
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: python3 -m src.prewarm
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    profiles:
      - prewarm

  # ── Test runner (profile=test) ───────────────────────────────────────────────
  # Run: docker compose run --rm test
  # Run specific file: docker compose run --rm test python3 -m pytest tests/test_market_data_store.py -v
  test:
    build:
      context: .
      target: test
    container_name: market-intelligence-test
    volumes:
      - ./data:/app/data
    restart: "no"
    profiles:
      - test

  # ── YouTube summary pipeline (runs once then exits, triggered by cron) ───────
  # Cron entries (LXC host, UTC):
  #   30 13 * * * cd /home/dev/workspace/Market-Intelligence && docker compose run --rm youtube-summarizer >> /home/dev/workspace/Market-Intelligence/youtube-pipeline/logs/cron.log 2>&1
  #   30 18 * * * cd /home/dev/workspace/Market-Intelligence && docker compose run --rm youtube-summarizer >> /home/dev/workspace/Market-Intelligence/youtube-pipeline/logs/cron.log 2>&1
  #   0 23 * * *  cd /home/dev/workspace/Market-Intelligence && docker compose run --rm youtube-summarizer >> /home/dev/workspace/Market-Intelligence/youtube-pipeline/logs/cron.log 2>&1
  #   30 2 * * *  cd /home/dev/workspace/Market-Intelligence && docker compose run --rm youtube-summarizer >> /home/dev/workspace/Market-Intelligence/youtube-pipeline/logs/cron.log 2>&1
  # Dry run:
  #   docker compose run --rm youtube-summarizer python3 main.py --dry-run
  # Single channel:
  #   docker compose run --rm youtube-summarizer python3 main.py --channel "Fireship"
  youtube-summarizer:
    build:
      context: .
      dockerfile: Dockerfile.youtube
    container_name: market-intelligence-youtube
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_YOUTUBE_WEBHOOK_URL}
      HOME: /root
    volumes:
      - ~/.claude:/root/.claude:ro
      - ~/.claude.json:/root/.claude.json:ro
      - /home/dev/.local/bin/claude:/usr/local/bin/claude:ro
      - ./youtube-pipeline/data:/app/data
      - ./youtube-pipeline/logs:/app/logs
      - ./youtube-pipeline/config.yaml:/app/config.yaml:ro
    restart: "no"
    profiles:
      - youtube

  # ── Market data refresh (daily OHLCV + fundamentals, profile=refresh) ───────
  # Cron entry (LXC host, ET timezone):
  #   30 16 * * 1-5 docker compose -f /root/market-intelligence/docker-compose.yml run -T --rm market-data-refresh >> /var/log/mi-market-data-refresh.log 2>&1
  # Initial backfill (2 years, run once manually):
  #   docker compose run --rm market-data-refresh python3 -m src.market_data.refresh --full
  market-data-refresh:
    build:
      context: .
      target: pipeline
    container_name: market-intelligence-data-refresh
    env_file: .env
    command: python3 -m src.market_data.refresh
    volumes:
      - ./data:/app/data
    restart: "no"
    profiles:
      - refresh

