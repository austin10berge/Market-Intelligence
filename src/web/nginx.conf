server {
    listen 9009;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile — known to cause issues with VMs/LXCs and certain network configs
    sendfile off;

    # Prevent nginx from closing keep-alive connections too aggressively
    keepalive_timeout 65;
    keepalive_requests 1000;

    # v2 SPA — must come before the catch-all location /
    location /v2/ {
        try_files $uri $uri/ /v2/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Morning brief — static HTML, never cache
    location /brief/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # Tell the browser not to cache index.html so it always gets the latest config.js
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache JS and CSS for 1 hour, but not config.js (it contains the dynamic API URL)
    location ~* \.(css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /app.js {
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /scanner.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # config.js must never be cached — it contains the dynamic API URL
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health check endpoint
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
