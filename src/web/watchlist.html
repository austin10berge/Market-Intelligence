<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Watchlist - Market Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .watchlist-container {
            max-width: 800px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 1rem;
            font-family: monospace;
            font-size: 1.1rem;
            resize: vertical;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-primary {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.5);
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
        }

        #status-msg {
            margin-left: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-success {
            color: #34d399;
        }

        .status-error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div id="app">
        <header class="glass">
            <div class="header-content">
                <h1>Edit Screener Watchlist</h1>
                <p>Modify the core pool of assets the options screener scans daily.</p>
            </div>
            <div class="posture-container">
                <a href="index.html" class="btn-secondary">← Back to Dashboard</a>
            </div>
        </header>

        <main class="watchlist-container">
            <section class="glass card">
                <h2>Active Watchlist</h2>
                <p class="subtitle">Enter stock and ETF tickers separated by commas.</p>

                <textarea id="watchlist-input" placeholder="AAPL, MSFT, SPY..."></textarea>

                <div class="action-bar">
                    <button id="save-btn" class="btn-primary" onclick="saveWatchlist()">Save Changes</button>
                    <span id="status-msg"></span>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        const input = document.getElementById("watchlist-input");
        const statusMsg = document.getElementById("status-msg");

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                input.value = "Loading...";
                const res = await fetch(`${API_BASE}/watchlist`);
                if (!res.ok) throw new Error("Network response was not ok");
                const data = await res.json();
                input.value = data.watchlist.join(", ");
            } catch (e) {
                input.value = "";
                showStatus("Failed to load watchlist.", "status-error");
            }
        });

        async function saveWatchlist() {
            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            btn.innerText = "Saving...";
            statusMsg.className = "";
            statusMsg.innerText = "";

            try {
                // Split by comma, trim whitespace
                const tickers = input.value.split(",").map(t => t.trim()).filter(t => t.length > 0);

                const res = await fetch(`${API_BASE}/watchlist`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ tickers })
                });

                if (!res.ok) throw new Error("Failed to save");

                const data = await res.json();
                input.value = data.watchlist.join(", ");
                showStatus("✅ Watchlist saved successfully!", "status-success");
            } catch (e) {
                showStatus("❌ Failed to save watchlist.", "status-error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Changes";
            }
        }

        function showStatus(msg, className) {
            statusMsg.innerText = msg;
            statusMsg.className = className;
            setTimeout(() => { if (statusMsg.innerText === msg) statusMsg.innerText = ""; }, 4000);
        }
    </script>
</body>

</html>
