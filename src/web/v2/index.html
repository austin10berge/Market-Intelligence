<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Market Intelligence</title>
    <!-- No custom fonts — system font stack (-apple-system / SF Pro) used throughout -->
    <style>
        :root {
            --tv-bg:       #000000;
            --tv-surface:  #1C1C1E;
            --tv-surface2: #2C2C2E;
            --tv-border:   rgba(255,255,255,0.08);
            --tv-text:     #FFFFFF;
            --tv-muted:    #8E8E93;
            --tv-green:    #26A69A;
            --tv-red:      #EF5350;
            --tv-blue:     #2196F3;
            --tv-yellow:   #FF9800;
            /* Row layout — keep in sync with .col-header-row */
            --col-spark: 40px;
            --col-a:     76px;
            --col-b:     62px;
            --col-c:     96px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: var(--tv-bg);
            color: var(--tv-text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        body::before { display: none; }

        /* ── Status bar ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
            background: #000000;
            border-bottom: 0.5px solid rgba(255,255,255,0.10);
            flex-shrink: 0;
        }

        .status-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--tv-text);
            letter-spacing: 0;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .composite-score {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: var(--tv-muted);
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
        }

        .posture-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid transparent;
        }
        .posture-pill.bullish { background: rgba(38,166,154,0.15);  color: #26A69A; border-color: rgba(38,166,154,0.3);  box-shadow: none; }
        .posture-pill.bearish { background: rgba(239,83,80,0.15);   color: #EF5350; border-color: rgba(239,83,80,0.3);   box-shadow: none; }
        .posture-pill.neutral { background: rgba(33,150,243,0.15);  color: #5B8AF5; border-color: rgba(33,150,243,0.3);  box-shadow: none; }
        .posture-pill.loading { background: rgba(255,255,255,0.06); color: var(--tv-muted); animation: fade-pulse 1.8s ease-in-out infinite; }

        .pulse-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot  { 0%,100%{opacity:1} 50%{opacity:0.3} }
        @keyframes fade-pulse { 0%,100%{opacity:0.4} 50%{opacity:0.85} }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            row-gap: 8px;
            padding: 12px 16px 8px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--tv-muted);
        }

        .cache-badge {
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 99px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .cache-badge:empty { display: none; }
        .cache-badge.market-closed { background: rgba(255,152,0,0.1);   color: #FF9800; border-color: rgba(255,152,0,0.25); }
        .cache-badge.market-open   { background: rgba(38,166,154,0.1);  color: #26A69A; border-color: rgba(38,166,154,0.25); }
        .cache-badge.live          { background: rgba(33,150,243,0.1);  color: #5B8AF5; border-color: rgba(33,150,243,0.25); }

        /* ── Column group tabs ── */
        .col-tabs {
            display: flex;
            gap: 4px;
            padding: 0 16px 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .col-tabs::-webkit-scrollbar { display: none; }

        .col-tab {
            flex: 0 0 auto;
            padding: 6px 16px;
            border-radius: 18px;
            border: none;
            background: transparent;
            color: var(--tv-muted);
            font-size: 15px;
            font-weight: 400;
            font-family: inherit;
            letter-spacing: 0;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .col-tab.active {
            color: #FFFFFF;
            background: var(--tv-surface2);
            font-weight: 600;
        }

        /* ── Column header row ── */
        .col-header-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--col-spark) var(--col-a) var(--col-b) var(--col-c);
            align-items: center;
            padding: 0 14px 6px;
            border-bottom: 0.5px solid rgba(255,255,255,0.18);
        }

        .ch-col {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--tv-muted);
            text-align: right;
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
            transition: color 0.15s;
            white-space: nowrap;
        }
        .ch-col:hover { color: var(--tv-text); }
        .ch-col.sorted { color: var(--tv-blue); }
        .ch-col .sort-dir { margin-left: 2px; opacity: 0.8; }

        /* Returns: name column same width as Price tab (equal 3-col split of remaining space) */
        #watchlist-content[data-group="Returns"] .col-header-row,
        #watchlist-content[data-group="Returns"] .ticker-row {
            grid-template-columns: minmax(0, 1fr) 40px 78px 78px 78px;
        }
        #watchlist-content[data-group="Fundmtls"] .col-header-row,
        #watchlist-content[data-group="Fundmtls"] .ticker-row,
        #watchlist-content[data-group="Options"] .col-header-row,
        #watchlist-content[data-group="Options"] .ticker-row {
            grid-template-columns: minmax(0, 1fr) 40px 66px 66px 66px;
        }

        /* ── Ticker rows ── */
        .ticker-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--col-spark) var(--col-a) var(--col-b) var(--col-c);
            align-items: center;
            gap: 0;
            padding: 0 14px;
            border-bottom: 0.5px solid rgba(255,255,255,0.18);
            cursor: pointer;
            height: 72px;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) { .ticker-row:hover { background: rgba(255,255,255,0.03); } }
        .ticker-row:active { background: rgba(255,255,255,0.05); }

        /* Left: symbol + name */
        .tr-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            padding-right: 8px;
        }
        .tr-symbol {
            font-family: inherit;
            font-size: 19px;
            font-weight: 600;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0;
        }
        .tr-name {
            font-size: 13px;
            font-weight: 400;
            color: #8E8E93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Center: compact sparkline */
        .tr-spark {
            width: var(--col-spark);
            height: 22px;
            flex-shrink: 0;
        }
        .tr-spark svg {
            width: 100%;
            height: 22px;
            display: block;
        }
        .tr-spark .sparkline-empty {
            color: var(--tv-muted);
            font-size: 12px;
        }

        /* Data columns — right-aligned, SF Pro Text with tabular numerals */
        .tr-col {
            font-family: inherit;
            font-size: 15px;
            font-weight: 400;
            text-align: right;
            white-space: nowrap;
            padding-left: 4px;
            font-variant-numeric: tabular-nums;
        }
        .tr-col.primary { font-size: 17px; font-weight: 600; color: #FFFFFF; }
        .tr-col.positive { color: var(--tv-green); }
        .tr-col.negative { color: var(--tv-red); }
        .tr-col.neutral  { color: var(--tv-muted); }
        .tr-col.pct-pill {
            font-size: 16px;
            font-weight: 400;
            padding: 0;
            border-radius: 0;
            display: block;
            margin-left: 0;
            background: none;
        }
        .tr-col.pct-pill.positive { background: none; color: var(--tv-green); }
        .tr-col.pct-pill.negative { background: none; color: var(--tv-red); }
        .tr-col.pct-pill.neutral  { background: none; color: var(--tv-muted); }

        /* Wrapper for pill col — needs flex to right-align the pill itself */
        .tr-col-wrap {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* ── TA annotation pills ── */
        .tr-ta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .tr-ta-col {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-left: 4px;
        }
        .tr-ta-col .tr-ta-pills {
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }
        .tr-ta-pill {
            font-family: inherit;
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
            text-transform: lowercase;
        }
        .tr-ta-pill.ta-green  { background: rgba(38,166,154,0.15);  color: #26A69A; border: 1px solid rgba(38,166,154,0.25); }
        .tr-ta-pill.ta-red    { background: rgba(239,83,80,0.15);   color: #EF5350; border: 1px solid rgba(239,83,80,0.25); }
        .tr-ta-pill.ta-amber  { background: rgba(255,152,0,0.13);   color: #FF9800; border: 1px solid rgba(255,152,0,0.22); }
        .tr-ta-pill.ta-muted  { background: rgba(142,142,147,0.13); color: var(--tv-muted); border: 1px solid rgba(142,142,147,0.22); }
        .tr-ta-pill.ta-blue   { background: rgba(33,150,243,0.13);  color: #5C8AFF; border: 1px solid rgba(33,150,243,0.25); }

        /* ── Empty / loading states ── */
        .list-message {
            padding: 48px 16px;
            text-align: center;
            color: var(--tv-muted);
            font-size: 16px;
        }
        .list-message.loading { animation: fade-pulse 1.8s ease-in-out infinite; }

        /* ── Bottom navigation ── */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #000000;
            border-top: 0.5px solid rgba(255,255,255,0.10);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #8E8E93;
            font-size: 10px;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 0;
            text-transform: none;
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.15s;
            padding: 8px 0;
            min-height: 49px;
        }
        .nav-item.active { color: #FFFFFF; font-weight: 600; }
        .nav-item svg { width: 22px; height: 22px; }

        /* ── Main content area — only scroll zone ── */
        #main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            padding-bottom: calc(49px + env(safe-area-inset-bottom) + 8px);
        }

        /* ── Watchlist sub-tabs ── */
        .watchlist-sub-tabs {
            display: flex;
            gap: 4px;
        }
        .sub-tab {
            padding: 6px 16px;
            border-radius: 18px;
            border: none;
            background: transparent;
            color: var(--tv-muted);
            font-size: 17px;
            font-weight: 400;
            font-family: inherit;
            letter-spacing: 0;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .sub-tab.active {
            color: #FFFFFF;
            background: var(--tv-surface2);
            font-weight: 600;
        }

        /* ── Option cards (CSP + LEAPS) ── */
        .option-card {
            padding: 12px 14px;
            border-bottom: 0.5px solid rgba(255,255,255,0.18);
            cursor: pointer;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) { .option-card:hover { background: rgba(255,255,255,0.03); } }
        .option-card:active { background: rgba(255,255,255,0.05); }

        .oc-row1 {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 3px;
        }
        .oc-symbol {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .oc-meta {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: var(--tv-muted);
            flex-shrink: 0;
        }
        .oc-highlight {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--tv-green);
            margin-left: auto;
        }
        .oc-row2 {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .oc-name {
            font-size: 13px;
            color: var(--tv-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }
        .oc-metrics {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: var(--tv-muted);
            flex-shrink: 0;
            text-align: right;
        }
        .oc-prem {
            color: var(--tv-green);
            font-size: 16px;
            font-weight: 600;
        }
        .oc-yield {
            color: var(--tv-text);
        }
        .option-card.tier-mid { /* tier styling carried by .oc-highlight color */ }

        /* Pagination */
        .option-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--tv-border);
        }
        .page-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid var(--tv-border);
            background: var(--tv-surface);
            color: var(--tv-text);
            font-size: 17px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn:not(:disabled):hover { background: var(--tv-surface2); }
        .page-info-text {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: var(--tv-muted);
        }

        /* ── Market Overview ── */
        .overview-section { padding: 0; }

        .overview-card {
            padding: 14px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
        }
        .overview-card-title {
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--tv-muted);
            margin-bottom: 10px;
        }
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
        }
        .overview-grid .overview-card {
            padding: 14px 12px;
            border-bottom: none;
            border-right: 0.5px solid rgba(255,255,255,0.08);
        }
        .overview-grid .overview-card:last-child {
            border-right: none;
        }

        .llm-text {
            font-size: 15px;
            color: var(--tv-text);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .posture-detail-score {
            font-family: inherit;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .posture-detail-label {
            font-size: 13px;
            color: var(--tv-muted);
        }

        /* Sector rows — flat TV-iOS list style */
        .sector-pills { display: flex; flex-direction: column; gap: 0; }
        .sector-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 0.5px solid rgba(255,255,255,0.18);
            background: none;
            border-radius: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .sector-pill:last-child { border-bottom: none; }
        @media (hover: hover) {
            .sector-pill:hover { background: rgba(255,255,255,0.03); }
        }
        .sector-pill-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--tv-green);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sector-pill.negative .sector-pill-icon { background: var(--tv-red); }
        .sector-pill-body {
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
        }
        .sector-pill-name {
            font-size: 14px;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sector-pill.negative .sector-pill-name { color: #FFFFFF; }
        .sector-pill-ticker {
            font-size: 12px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            color: #8E8E93;
            flex-shrink: 0;
        }
        .sector-pill.negative .sector-pill-ticker { color: #8E8E93; }
        .sector-pill-pct {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            color: var(--tv-green);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .sector-pill.negative .sector-pill-pct { color: var(--tv-red); }
        .sector-pill-sub { margin-left: 16px; }
        .basket-pill { cursor: pointer; }

        /* Sector timeframe selector */
        .sector-tf-row {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: none;
            padding: 0;
        }
        .sector-tf-btn {
            flex: 0 0 auto;
            padding: 5px 14px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: var(--tv-muted);
            background: transparent;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .sector-tf-btn.active {
            background: var(--tv-surface2);
            color: #FFFFFF;
            font-weight: 600;
        }

        /* Slide animations on timeframe change */
        @keyframes sector-slide-fwd  { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes sector-slide-back { from { transform: translateX(-16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .sector-pills.anim-fwd  { animation: sector-slide-fwd  0.18s ease; }
        .sector-pills.anim-back { animation: sector-slide-back 0.18s ease; }

        /* Sector card header with toggle */
        .sector-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .sector-card-header .overview-card-title { margin-bottom: 0; }
        .sector-toggle {
            display: flex;
            background: none;
            padding: 0;
            gap: 4px;
        }
        .sector-toggle-btn {
            background: transparent;
            border: none;
            color: var(--tv-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            padding: 5px 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .sector-toggle-btn.active {
            background: var(--tv-surface2);
            color: #FFFFFF;
            font-weight: 600;
        }

        /* Basket expand/collapse */
        .basket-row { cursor: pointer; }
        @media (hover: hover) { .basket-row:hover { background: rgba(255,255,255,0.03); border-radius: 4px; } }
        .basket-chevron {
            display: inline-block;
            font-size: 8px;
            margin-right: 4px;
            color: var(--tv-muted);
            transition: transform 0.15s;
            line-height: 1;
        }
        .theme-basket-label { display: flex; align-items: center; }
        .basket-sub-row { background: rgba(255,255,255,0.02); border-radius: 2px; }

        .vix-spot { font-family: ui-monospace, 'SF Mono', 'Menlo', monospace; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .vix-changes { font-size: 12px; color: var(--tv-muted); margin-bottom: 6px; }
        .vix-term { font-size: 12px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .vix-term.contango     { background: rgba(38,166,154,0.15);  color: var(--tv-green); }
        .vix-term.backwardation{ background: rgba(239,83,80,0.15);   color: var(--tv-red); }
        .vix-term.flat         { background: rgba(255,152,0,0.15);   color: var(--tv-yellow); }

        .gex-value { font-family: ui-monospace, 'SF Mono', 'Menlo', monospace; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .gex-value.positive { color: var(--tv-green); }
        .gex-value.negative { color: var(--tv-red); }
        .gex-label { font-size: 12px; color: var(--tv-muted); margin-bottom: 4px; }
        .gex-avg   { font-size: 12px; color: var(--tv-muted); }

        .breadth-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .breadth-label { min-width: 4rem; color: var(--tv-muted); font-size: 12px; }
        .breadth-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
        .breadth-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
        .breadth-bar-fill.green  { background: var(--tv-green); }
        .breadth-bar-fill.yellow { background: var(--tv-yellow); }
        .breadth-bar-fill.red    { background: var(--tv-red); }
        .breadth-value { min-width: 2.5rem; text-align: right; font-family: ui-monospace, 'SF Mono', 'Menlo', monospace; font-size: 12px; font-weight: 600; }
        .breadth-value.green  { color: var(--tv-green); }
        .breadth-value.yellow { color: var(--tv-yellow); }
        .breadth-value.red    { color: var(--tv-red); }
        .breadth-ad { font-size: 12px; color: var(--tv-muted); }
        .breadth-ad.positive { color: var(--tv-green); }
        .breadth-ad.negative { color: var(--tv-red); }

        /* ── Wheel stats grid ── */
        .whl-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
        }
        .whl-stat {
            padding: 14px 14px;
            border-right: 0.5px solid rgba(255,255,255,0.08);
        }
        .whl-stat:nth-child(even) { border-right: none; }
        .whl-stat:nth-child(n+3) { border-top: 0.5px solid rgba(255,255,255,0.08); }
        .whl-stat-label {
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--tv-muted);
            margin-bottom: 6px;
        }
        .whl-stat-val {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--tv-text);
            line-height: 1.1;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }
        .whl-stat-sub { font-size: 12px; color: var(--tv-muted); }

        /* ── Wheel ticker rows (Symbol Performance) ── */
        .whl-ticker-row {
            padding: 12px 16px;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }
        @media (hover: hover) { .whl-ticker-row:hover { background: rgba(255,255,255,0.03); } }
        .whl-ticker-row:active { background: rgba(255,255,255,0.05); }

        /* ── Handoff view ── */
        .handoff-view { padding: 40px 20px; text-align: center; }
        .handoff-title { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 8px; }
        .handoff-desc  { font-size: 16px; color: var(--tv-muted); margin-bottom: 24px; line-height: 1.5; }
        .handoff-btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            background: rgba(41,98,255,0.15);
            border: 1px solid rgba(41,98,255,0.4);
            color: #5B8AF5;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .handoff-btn:hover { background: rgba(41,98,255,0.25); border-color: rgba(41,98,255,0.6); }

        /* ── CSP Scanner shell ── */
        .scanner-view { padding-bottom: 8px; }

        .scanner-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px 8px;
        }

        .scanner-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--tv-muted);
            flex: 1;
        }

        /* Freshness badge — reuses cache-badge shape/sizing, adds scanner-specific states */
        .data-freshness-badge {
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 99px;
            font-weight: 500;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            white-space: nowrap;
            border: 1px solid transparent;
            flex-shrink: 0;
        }
        .data-freshness-badge:empty { display: none; }
        .data-freshness-badge.fresh {
            background: rgba(38,166,154,0.1);
            color: var(--tv-green);
            border-color: rgba(38,166,154,0.25);
        }
        .data-freshness-badge.stale {
            background: rgba(255,152,0,0.1);
            color: var(--tv-yellow);
            border-color: rgba(255,152,0,0.25);
        }
        .data-freshness-badge.empty {
            background: rgba(120,123,134,0.1);
            color: var(--tv-muted);
            border-color: rgba(120,123,134,0.2);
        }

        /* Filters button — pill style matching .col-tab */
        .scn-filters-btn {
            padding: 6px 16px;
            border-radius: 18px;
            border: none;
            background: transparent;
            color: var(--tv-muted);
            font-size: 15px;
            font-weight: 400;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .scn-filters-btn:hover {
            color: var(--tv-text);
        }
        .scn-filters-btn.has-filters {
            color: #FFFFFF;
            background: var(--tv-surface2);
            font-weight: 600;
        }

        /* Active-params chip row */
        .scn-active-params {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 0 16px 8px;
            min-height: 0;
        }
        .scn-active-params:empty { display: none; }

        .scn-chip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 99px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            background: rgba(41,98,255,0.1);
            color: #5B8AF5;
            border: 1px solid rgba(41,98,255,0.25);
        }
        .scn-chip.muted {
            background: rgba(120,123,134,0.08);
            color: var(--tv-muted);
            border-color: rgba(120,123,134,0.15);
        }

        /* ── CSP Scanner funnel strip ── */
        .scn-funnel-wrap {
            position: relative;
        }
        .scn-funnel-wrap::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 40px;
            background: linear-gradient(to right, transparent, var(--tv-bg));
            pointer-events: none;
        }
        .scn-funnel {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 0 16px 10px;
            border-bottom: 1px solid var(--tv-border);
            margin-bottom: 2px;
        }
        .scn-funnel::-webkit-scrollbar { display: none; }
        .fc {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 3px;
            padding: 7px 16px 7px 0;
            margin-right: 16px;
            position: relative;
            flex-shrink: 0;
        }
        .fc:not(.fc-cache)::after {
            content: '›';
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            color: var(--tv-border);
            font-size: 17px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            line-height: 1;
        }
        .fc-label {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.07em;
            color: var(--tv-muted); white-space: nowrap;
        }
        .fc-val {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px; font-weight: 600;
            color: var(--tv-text);
            white-space: nowrap; letter-spacing: 0.01em; line-height: 1;
        }
        .fc:nth-last-child(2) .fc-val { color: var(--tv-green); }
        .fc-cache {
            margin-left: auto; margin-right: 0;
            padding: 4px 9px; border-radius: 99px;
            border: 1px solid rgba(120,123,134,0.2);
            background: rgba(120,123,134,0.07);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px; font-weight: 500;
            color: var(--tv-muted); white-space: nowrap;
            letter-spacing: 0.03em; align-self: center; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid rgba(120,123,134,0.25);
            border-top-color: var(--tv-muted);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 6px; flex-shrink: 0;
        }

        /* ── Stock Performance collapsible block ── */
        .scn-stockperf { border-bottom: 1px solid var(--tv-border); margin-bottom: 2px; }
        .scn-perf-toggle {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 7px 16px; border: none; border-radius: 0;
            background: transparent; color: var(--tv-muted);
            font-size: 12px; font-weight: 600; font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            letter-spacing: 0.03em; cursor: pointer; text-align: left;
            transition: color 0.15s, background 0.15s;
        }
        .scn-perf-toggle:hover { color: var(--tv-text); background: rgba(255,255,255,0.03); }
        .scn-perf-caret { font-size: 13px; line-height: 1; color: var(--tv-muted); transition: color 0.15s; flex-shrink: 0; }
        .scn-perf-toggle:hover .scn-perf-caret { color: var(--tv-text); }
        /* Stock Performance body hosts the shared tickers table (.col-tabs/.col-header-row/.ticker-row),
           which carry their own horizontal padding — so the body only adds bottom spacing. */
        .scn-perf-body { padding-bottom: 8px; }
        .text-green { color: var(--tv-green); }
        .text-red   { color: var(--tv-red); }
        /* CSP candidate card: company name stacked under the symbol (mirrors the Watchlist .tr-left). */
        .oc-sym-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-shrink: 1; }
        .oc-subname {
            font-size: 12px; color: var(--tv-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;
        }
        /* Phone — keep status bar on one line */
        @media (max-width: 480px) {
            .status-title    { white-space: nowrap; }
            .composite-score { font-size: 11px; }
            .posture-pill    { font-size: 12px; white-space: nowrap; padding: 3px 8px; }
        }

        /* ── Filter Sheet Overlay ── */

        .scn-sheet-root {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
        }

        .scn-sheet-root.open {
            display: block;
            background: rgba(0, 0, 0, 0.6);
        }

        .scn-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 90vh;
            background: var(--tv-surface);
            border-top: 1px solid var(--tv-border);
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
        }

        .scn-sheet-root.open .scn-sheet {
            transform: translateY(0);
        }

        .scn-sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--tv-border);
            flex-shrink: 0;
        }

        .scn-sheet-title {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--tv-text);
            letter-spacing: 0.02em;
        }

        .scn-sheet-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: var(--tv-muted);
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            line-height: 1;
        }

        .scn-sheet-close:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .scn-sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .scn-sheet-section {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--tv-border);
        }

        .scn-sheet-section:last-child {
            border-bottom: none;
        }

        .scn-sheet-section-title {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--tv-muted);
            margin-bottom: 10px;
        }

        .scn-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(42, 46, 57, 0.5);
        }

        .scn-field:last-child {
            border-bottom: none;
        }

        .scn-field-label {
            font-family: inherit;
            font-size: 15px;
            color: var(--tv-text);
        }

        .scn-field-input {
            width: 90px;
            padding: 5px 8px;
            background: var(--tv-bg);
            border: 1px solid var(--tv-border);
            border-radius: 5px;
            color: var(--tv-text);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            text-align: right;
            -moz-appearance: textfield;
            appearance: textfield;
            transition: border-color 0.15s;
        }

        .scn-field-input::-webkit-inner-spin-button,
        .scn-field-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .scn-field-input:focus {
            outline: none;
            border-color: var(--tv-blue);
        }

        .scn-field-input::placeholder {
            color: var(--tv-muted);
            opacity: 0.6;
        }

        .scn-cond-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .scn-cond-chip {
            padding: 5px 10px;
            border-radius: 99px;
            border: 1px solid var(--tv-border);
            background: var(--tv-bg);
            color: var(--tv-muted);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .scn-cond-chip:hover {
            border-color: var(--tv-muted);
            color: var(--tv-text);
        }

        .scn-cond-chip.active {
            background: rgba(41, 98, 255, 0.15);
            border-color: var(--tv-blue);
            color: #5B8AF5;
        }

        .scn-sector-checks {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .scn-sector-check {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            color: var(--tv-text);
            -webkit-tap-highlight-color: transparent;
        }

        .scn-sector-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--tv-blue);
            cursor: pointer;
            flex-shrink: 0;
        }

        .scn-sheet-footer {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            padding-bottom: 72px;
            border-top: 1px solid var(--tv-border);
            background: var(--tv-surface);
            flex-shrink: 0;
        }

        .scn-sheet-apply {
            flex: 1;
            padding: 11px;
            border-radius: 7px;
            border: none;
            background: var(--tv-blue);
            color: #fff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s;
        }

        .scn-sheet-apply:hover {
            background: #1a4fcc;
        }

        .scn-sheet-rescan {
            flex: 1;
            padding: 11px;
            border-radius: 7px;
            border: 1px solid var(--tv-border);
            background: var(--tv-surface2);
            color: var(--tv-text);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s;
        }

        .scn-sheet-rescan:hover {
            border-color: var(--tv-muted);
            color: #fff;
        }

        /* ── Edit Watchlist ── */
        .edit-pencil-btn {
            display: flex;
            align-items: center;
            padding: 4px 6px;
            border: none;
            background: none;
            color: var(--tv-muted);
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            border-radius: 4px;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        .edit-pencil-btn:hover { color: var(--tv-text); background: rgba(255,255,255,0.05); }

        .edit-back-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0;
            border: none;
            background: none;
            color: var(--tv-muted);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .edit-back-btn:hover { color: var(--tv-text); }

        .edit-chip-editor {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 8px 0 10px;
            min-height: 40px;
        }

        .edit-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 4px 3px 8px;
            border-radius: 99px;
            background: rgba(41,98,255,0.1);
            border: 1px solid rgba(41,98,255,0.3);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #5B8AF5;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }

        .edit-chip-remove {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            padding: 0;
            border: none;
            background: none;
            color: var(--tv-muted);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            transition: color 0.12s, background 0.12s;
            flex-shrink: 0;
        }
        .edit-chip-remove:hover { color: var(--tv-text); background: rgba(255,255,255,0.1); }

        .edit-chip-input {
            border: none;
            background: none;
            outline: none;
            color: var(--tv-text);
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            min-width: 80px;
            width: 80px;
            text-transform: uppercase;
            caret-color: var(--tv-blue);
        }
        .edit-chip-input::placeholder {
            color: var(--tv-muted);
            opacity: 0.5;
            text-transform: none;
            letter-spacing: 0;
        }

        .edit-weight-sum-badge {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 99px;
            border: 1px solid transparent;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }
        .edit-weight-sum-badge.valid   { color: var(--tv-green);  background: rgba(8,153,129,0.1);  border-color: rgba(8,153,129,0.3);  }
        .edit-weight-sum-badge.close   { color: var(--tv-yellow); background: rgba(247,201,72,0.1); border-color: rgba(247,201,72,0.3); }
        .edit-weight-sum-badge.invalid { color: var(--tv-red);    background: rgba(242,54,69,0.1);  border-color: rgba(242,54,69,0.3);  }

        .edit-toggle-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
        .edit-toggle-input   { position: absolute; opacity: 0; width: 0; height: 0; }
        .edit-toggle-track {
            display: block;
            width: 40px; height: 22px;
            background: var(--tv-surface2);
            border: 1px solid var(--tv-border);
            border-radius: 9999px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            position: relative;
        }
        .edit-toggle-track::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 14px; height: 14px;
            background: var(--tv-muted);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .edit-toggle-input:checked + .edit-toggle-track {
            background: rgba(41,98,255,0.25);
            border-color: rgba(41,98,255,0.5);
        }
        .edit-toggle-input:checked + .edit-toggle-track::after {
            transform: translateX(18px);
            background: var(--tv-blue);
        }

        .edit-status {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            font-weight: 500;
            min-height: 18px;
            margin-top: 6px;
        }
        .edit-status.success { color: var(--tv-green); }
        .edit-status.error   { color: var(--tv-red); }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-4px); }
            40%      { transform: translateX(4px); }
            60%      { transform: translateX(-3px); }
            80%      { transform: translateX(3px); }
        }
        .shake { animation: shake 0.4s ease; }

        /* ── Backtester ── */
        .bkt-view { padding-bottom: 80px; }

        .bkt-panel { display: none; }
        .bkt-panel.active { display: block; }

        .bkt-asset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .bkt-asset-btn {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            color: var(--tv-muted);
            border-radius: 6px;
            padding: 7px 4px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .bkt-asset-btn.active {
            border-color: var(--tv-blue);
            color: var(--tv-text);
            background: rgba(41, 98, 255, 0.12);
        }

        .bkt-toggle-group {
            display: inline-flex;
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 6px;
            overflow: hidden;
        }
        .bkt-toggle-btn {
            background: transparent;
            border: none;
            color: var(--tv-muted);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .bkt-toggle-btn + .bkt-toggle-btn { border-left: 1px solid var(--tv-border); }
        .bkt-toggle-btn.active {
            background: var(--tv-blue);
            color: #fff;
        }

        .bkt-strategy-select {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            color: var(--tv-text);
            border-radius: 6px;
            padding: 5px 8px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            max-width: 160px;
        }
        .bkt-icon-btn {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            color: var(--tv-muted);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 13px;
            cursor: pointer;
            line-height: 1;
        }
        .bkt-icon-btn:hover { color: var(--tv-red); border-color: var(--tv-red); }

        .bkt-strategy-summary {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            color: var(--tv-muted);
            padding: 6px 10px;
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 6px;
            min-height: 38px;
            line-height: 1.5;
        }

        .bkt-condition-node {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .bkt-cond-select {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            color: var(--tv-text);
            border-radius: 6px;
            padding: 5px 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 90px;
        }
        .bkt-cond-input {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            color: var(--tv-text);
            border-radius: 6px;
            padding: 5px 6px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 13px;
            width: 72px;
        }
        .bkt-cond-remove {
            background: transparent;
            border: none;
            color: var(--tv-muted);
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px;
        }
        .bkt-cond-remove:hover { color: var(--tv-red); }

        .bkt-add-cond-btn {
            background: transparent;
            border: 1px dashed var(--tv-border);
            color: var(--tv-muted);
            border-radius: 6px;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            margin-top: 4px;
            transition: border-color 0.15s, color 0.15s;
        }
        .bkt-add-cond-btn:hover { border-color: var(--tv-blue); color: var(--tv-blue); }

        .bkt-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .bkt-stat-card {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .bkt-stat-label {
            font-family: inherit;
            font-size: 11px;
            color: var(--tv-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 2px;
        }
        .bkt-stat-val {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            color: var(--tv-text);
        }

        .bkt-chart-container {
            margin: 0 14px 12px;
            height: 280px;
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .bkt-loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(19, 23, 34, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .bkt-loading-card {
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 12px;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--tv-text);
        }

        .bkt-trades-table {
            width: 100%;
            border-collapse: collapse;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
        }
        .bkt-trades-table th {
            padding: 6px 10px;
            text-align: right;
            font-weight: 600;
            color: var(--tv-muted);
            border-bottom: 1px solid var(--tv-border);
            white-space: nowrap;
        }
        .bkt-trades-table th:first-child,
        .bkt-trades-table td:first-child { text-align: left; }
        .bkt-trades-table td {
            padding: 5px 10px;
            text-align: right;
            border-bottom: 1px solid rgba(42, 46, 57, 0.5);
            color: var(--tv-text);
        }
        .bkt-trades-table tbody tr:last-child td { border-bottom: none; }

        .bkt-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            font-weight: 600;
            background: var(--tv-surface2);
            color: var(--tv-muted);
        }
        .bkt-badge-green { background: rgba(8, 153, 129, 0.15); color: var(--tv-green); }
        .bkt-badge-red   { background: rgba(242, 54, 69, 0.15);  color: var(--tv-red); }
        .bkt-badge-blue  { background: rgba(41, 98, 255, 0.15);  color: var(--tv-blue); }

        .bkt-res-tab { }
        .bkt-res-panel { }

        .bkt-advanced-only { display: none; }
        .bkt-adv-block { display: none; }
        .bkt-adv-flex { display: none; }

        /* ── Charts (Technical Analysis) ── */
        .anlys-view { padding-bottom: 80px; }

        .anlys-controls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .anlys-ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 6px;
            padding: 5px 8px;
        }
        .anlys-ctrl-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            font-size: 12px;
            color: var(--tv-muted);
            cursor: pointer;
            white-space: nowrap;
        }
        .anlys-ctrl-label input[type=checkbox] { cursor: pointer; }
        .anlys-ctrl-num {
            width: 52px !important;
            padding: 3px 5px !important;
            font-size: 12px !important;
            text-align: right;
        }

        .anlys-card {
            margin: 0 14px 12px;
            background: var(--tv-surface);
            border: 1px solid var(--tv-border);
            border-radius: 10px;
            overflow: hidden;
        }
        .anlys-card-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 10px 12px 8px;
        }
        .anlys-symbol {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--tv-text);
        }
        .anlys-subtitle {
            font-family: inherit;
            font-size: 12px;
            color: var(--tv-muted);
        }

        .anlys-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 10px 8px;
        }
        .anlys-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--tv-surface2);
            border-radius: 5px;
            padding: 4px 8px;
            min-width: 44px;
        }
        .anlys-chip-val {
            font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--tv-text);
            line-height: 1.2;
        }
        .anlys-chip-lbl {
            font-family: inherit;
            font-size: 10px;
            color: var(--tv-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            line-height: 1.2;
            margin-top: 1px;
        }

        .anlys-chart-container {
            height: 380px;
            background: var(--tv-bg);
        }

        /* ── Questrial: Watchlist (entire page incl. Edit Watchlist), the small
               label text on Overview, the Scanner's parameter/filter sheet, and
               the Charts result-card typography. Scoped by ancestor so shared
               components (ticker rows, field rows, buttons) keep their original
               font everywhere else they're reused (Scanner results, Backtester,
               Charts controls). ── */
        /* All font-family overrides removed — body uses system font (-apple-system)
           and all components inherit it. ui-monospace is applied directly to numeric
           columns via .tr-col. */
    </style>
</head>
<body>

    <div class="status-bar">
        <span class="status-title">Market Intelligence</span>
        <div class="status-right">
            <span class="composite-score" id="composite-score"></span>
            <div class="posture-pill loading" id="posture-widget">
                <span class="pulse-dot"></span>Loading
            </div>
        </div>
    </div>

    <div id="main-content"></div>

    <nav class="bottom-nav" id="bottom-nav"></nav>

    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/config.js"></script>
    <script src="./scanner.js"></script>
    <script src="./backtester.js"></script>
    <script src="./analysis.js"></script>
    <script src="./wheel.js"></script>
    <script src="./app.js"></script>
</body>
</html>
