# Local development override for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm pipeline
#
# This file overrides MARKET_INTELLIGENCE_API_URL so the browser calls
# localhost:8000 instead of the production server. It also exposes the API
# port explicitly in case you want to hit it directly from the browser.
#
# Volume mounts shadow /app/src with the active worktree source so code changes
# are picked up immediately without rebuilding images. Only rebuild when
# dependencies (pyproject.toml) change.
#
# WORKTREE: update this path when switching to a different worktree.
#
# The base docker-compose.yml is unchanged so production deploys are unaffected.

x-worktree-src: &worktree-src
  - /home/dev/workspace/Market-Intelligence/.claude/worktrees/bridge-cse_01D8aN9KY9Ljdj8g6T6JAnSf/src:/app/src

services:
  dashboard:
    environment:
      MARKET_INTELLIGENCE_API_URL: http://localhost:8000/api

  api:
    volumes: *worktree-src

  pipeline:
    volumes: *worktree-src
