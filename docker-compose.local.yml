# Local development override for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm pipeline
#
# This file overrides MARKET_INTELLIGENCE_API_URL so the browser calls
# localhost:8000 instead of the production server. It also exposes the API
# port explicitly in case you want to hit it directly from the browser.
#
# Volume mounts shadow the COPYed image layers with the active worktree
# source so code changes are picked up immediately without rebuilding.
# Only rebuild when dependencies (pyproject.toml) change.
#
# WORKTREE: update WORKTREE_ROOT below when switching to a different worktree.
# Currently pointed at: main branch (src/) — the feat/wheel-tracker worktree is stale
# (main has since merged and gone past it, plus later uncommitted fixes)
#
# The base docker-compose.yml is unchanged so production deploys are unaffected.

x-worktree-src: &worktree-src
  - /home/dev/workspace/Market-Intelligence/src:/app/src

# The dashboard image bakes web assets in at build time, so HTML/JS edits
# don't show up unless we shadow them too. We mount individual files (not the
# whole src/web/) so the entrypoint can still write config.js into the
# image filesystem without polluting the worktree.
x-worktree-dashboard: &worktree-dashboard
  - /home/dev/workspace/Market-Intelligence/src/web/watchlist.html:/usr/share/nginx/html/watchlist.html
  - /home/dev/workspace/Market-Intelligence/src/web/scanner.html:/usr/share/nginx/html/scanner.html
  - /home/dev/workspace/Market-Intelligence/src/web/scanner.js:/usr/share/nginx/html/scanner.js
  - /home/dev/workspace/Market-Intelligence/src/web/v2:/usr/share/nginx/html/v2

services:
  dashboard:
    environment:
      MARKET_INTELLIGENCE_API_URL: https://dev-mi.austin10berge.com/api
    volumes: *worktree-dashboard

  api:
    volumes: *worktree-src

  pipeline:
    volumes:
      - /home/dev/workspace/Market-Intelligence/src:/app/src
      - ~/.claude:/root/.claude:ro
      - /usr/local/bin/claude:/usr/local/bin/claude:ro

  market-data-refresh:
    volumes:
      - /home/dev/workspace/Market-Intelligence/src:/app/src

  test:
    volumes:
      - /home/dev/workspace/Market-Intelligence/src:/app/src
      - /home/dev/workspace/Market-Intelligence/tests:/app/tests
